# Copyright and licensing of every file in this repository, in the REUSE
# format (https://reuse.software/spec-3.3/). The license texts are in
# LICENSES/; check the whole tree with `reuse lint`.
#
# Later annotations override earlier ones for the files they match. The
# third-party XSDs are not in the repository (scripts/fetch-schemas.sh
# fetches them; git ignores them, and so does reuse).
version = 1

# KrabInvoice itself: AGPL-3.0-or-later with the KrabInvoice Configuration
# Exception (LICENSE-EXCEPTION).
[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 The KrabInvoice authors"
SPDX-License-Identifier = "AGPL-3.0-or-later WITH LicenseRef-KrabInvoice-Configuration-Exception"

# The demo configuration: public domain (config/LICENSE).
[[annotations]]
path = "config/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 The KrabInvoice authors"
SPDX-License-Identifier = "CC0-1.0"
