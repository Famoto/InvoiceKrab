# PRECEDING INVOICE (BG-3), BILLING PERIOD (BG-14), ALLOWANCES/CHARGES (BG-20/21),
# VAT BREAKDOWN (BG-23), PAYMENT TERMS (BT-9/20), TOTALS (BG-22)
# ===========================================================================
