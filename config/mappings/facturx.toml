# Factur-X / ZUGFeRD reference spoke — the French-German hybrid e-invoice, a CIUS
# of EN 16931 over the UN/CEFACT `CrossIndustryInvoice` (CII) syntax.
#
# The XML tree is identical to `cii.toml`, so this spoke *inherits* it
# (`inherits = "cii-invoice:en16931"`) and adds nothing but its own identity. Every node comes from the CII base unchanged, so
# Factur-X documents round-trip through the shared hub with every other spoke.
[meta]
doc_format = "facturx-invoice"
format_version = "1.0"
mapping_version = "1.0"
source_model = "facturx-invoice:1.0"
canonical_model = "canonical-invoice:1.0"
root = "CrossIndustryInvoice"
inherits = "cii-invoice:en16931"

# Document identity: Factur-X (FR) and ZUGFeRD 2.x (DE) are the same syntax and
# name their profile in the guideline id (BT-24). This spoke maps the EN 16931
# profile, so it reads that profile and BASIC (a subset of it); MINIMUM and
# BASIC WL carry no lines and EXTENDED goes beyond EN 16931, so they are
# refused rather than read lossily.
[meta.identity]
profile = "ExchangedDocumentContext.GuidelineSpecifiedDocumentContextParameter.ID"
profiles = [
    "urn:cen.eu:en16931:2017",
    "urn:cen.eu:en16931:2017#compliant#urn:factur-x.eu:1p0:basic",
]

# Schema conformance: written documents must validate against the Factur-X
# EN 16931 profile schema (CII D16B, restricted to the profile).
[meta.schema]
xsd = "testfiles/xsd/facturx-en16931/Factur-X_EN16931.xsd"

# The full EN 16931 invoice (as testfiles/en16931-full-ubl.xml) in CII syntax.
[[meta.samples]]
file = "testfiles/en16931-full-cii.xml"

# BT-24: a Factur-X EN 16931 profile document identifies itself by the plain
# EN 16931 specification identifier, whatever the source said.
[CrossIndustryInvoice.ExchangedDocumentContext.GuidelineSpecifiedDocumentContextParameter.ID]
constant = "urn:cen.eu:en16931:2017"
