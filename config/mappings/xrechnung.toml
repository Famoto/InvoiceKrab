# XRechnung 3.0.2 — full CIUS of EN 16931 over UBL `Invoice` syntax.
#
# XRechnung shares the entire UBL Invoice element tree, so this spoke *inherits*
# `ubl.toml` (`inherits = "ubl-invoice:2.1"`) and only restates what the CIUS
# changes. The base's ~150 nodes are folded in ancestor-first at build time; a
# table below merges over the matching base node (`replace = true` would swap
# it out whole instead).
#
# CIUS deltas over the UBL base (inherited nodes merge field-wise, so each
# override states only what changes):
#   * `[meta]` identity: its own doc_format/format_version/source_model, plus the
#     `detect` marker (matched case-insensitively against CustomizationID, BT-24,
#     which for the CIUS carries `...:xrechnung_3.0`).
#   * `CustomizationID` (BT-24) is pinned to the XRechnung 3.0 URN, and the
#     business process type (BT-23) is mandatory — `required = true`.
#
# Everything else (BT-1…BT-163, BG-1…BG-32, all collections and nesting) comes
# from `ubl.toml` unchanged; see it for the DSL conventions and per-node docs.
[meta]
doc_format = "xrechnung-invoice"
format_version = "3.0.2"
mapping_version = "2.1"
source_model = "xrechnung-invoice:3.0.2"
canonical_model = "canonical-invoice:1.0"
root = "Invoice"
inherits = "ubl-invoice:2.1"
# Matched case-insensitively against the document's CustomizationID (BT-24),
# which for the CIUS carries `...:xrechnung_3.0`.
detect = ["xrechnung"]

# The XRechnung 3.0.2 example invoice: valid against the inherited UBL 2.1
# schema, read by this spoke, written by every spoke with a schema, and read
# back by each (`krab-cli --check`).
[[meta.samples]]
file = "testfiles/xrechnung-3.0.2-beispiel.xml"

# Overrides the base UBL node: the CIUS writes its own specification
# identifier (BT-24). An override merges over the inherited node, so only the
# delta is stated here; type, canonical key and normalization come from ubl.toml.
[Invoice.CustomizationID]
constant = "urn:cen.eu:en16931:2017#compliant#urn:xeinkauf.de:kosit:xrechnung_3.0"

# XRechnung 3.0 makes the business process type (BT-23) mandatory; the CIUS
# leaves its value to the parties, so it must come from the source.
[Invoice.ProfileID]
required = true

# The terms XRechnung 3.0 makes mandatory beyond EN 16931: the parties'
# electronic addresses (BT-34 / BT-49, with scheme), the buyer reference
# (BR-DE-15), the seller contact (BR-DE-2/5/6/7), seller and buyer city and
# post code (BR-DE-3/4/8/9) and the payment means (BR-DE-1). A source lacking
# one fails with REQUIRED_MISSING instead of yielding an invalid XRechnung.
[Invoice.AccountingSupplierParty.Party.EndpointID]
required = true

[Invoice.AccountingSupplierParty.Party.EndpointID.schemeID]
required = true

[Invoice.AccountingCustomerParty.Party.EndpointID]
required = true

[Invoice.AccountingCustomerParty.Party.EndpointID.schemeID]
required = true

[Invoice.BuyerReference]
required = true

[Invoice.AccountingSupplierParty.Party.Contact.Name]
required = true

[Invoice.AccountingSupplierParty.Party.Contact.Telephone]
required = true

[Invoice.AccountingSupplierParty.Party.Contact.ElectronicMail]
required = true

[Invoice.AccountingSupplierParty.Party.PostalAddress.CityName]
required = true

[Invoice.AccountingSupplierParty.Party.PostalAddress.PostalZone]
required = true

[Invoice.AccountingCustomerParty.Party.PostalAddress.CityName]
required = true

[Invoice.AccountingCustomerParty.Party.PostalAddress.PostalZone]
required = true

[Invoice.PaymentMeans.PaymentMeansCode]
required = true
