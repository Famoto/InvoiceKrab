# Codecs of Peppol BIS Billing 3.0.

# The Electronic Address Scheme codes Peppol accepts on an endpoint
# (PEPPOL-EN16931-CL008; OpenPeppol code list as of release 2026.5), as an
# identity table: any other scheme — such as `EM`, which EN 16931 and XRechnung
# allow — cannot be written to or read from a Peppol document (CODEC_INVALID),
# so it never yields an invalid one.
