<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Memory stays bounded under load">

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .title { font-size:16px; font-weight:600; fill:var(--ink); }
  .sub { font-size:12px; fill:var(--ink2); }
  .tick { font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums; }
  .axlab { font-size:11px; fill:var(--ink2); }
  .lab { font-size:12px; fill:var(--ink); }
  .val { font-size:11px; fill:var(--ink2); font-variant-numeric:tabular-nums; }
  .grid { stroke:var(--grid); stroke-width:1; }
  .base { stroke:var(--axis); stroke-width:1; }
  .ref { stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; fill:none; }
</style>
<rect width="760" height="380" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="32">Memory stays bounded under load</text>
<text class="sub" x="24" y="52">Idle: 3 MB. Beyond 4 at once (one per worker) extra invoices wait in line, holding only their upload.</text>
<line class="grid" x1="80" x2="728" y1="320.0" y2="320.0"/>
<text class="tick" x="72" y="324.0" text-anchor="end">0 MB</text>
<line class="grid" x1="80" x2="728" y1="275.2" y2="275.2"/>
<text class="tick" x="72" y="279.2" text-anchor="end">50 MB</text>
<line class="grid" x1="80" x2="728" y1="230.4" y2="230.4"/>
<text class="tick" x="72" y="234.4" text-anchor="end">100 MB</text>
<line class="grid" x1="80" x2="728" y1="185.6" y2="185.6"/>
<text class="tick" x="72" y="189.6" text-anchor="end">150 MB</text>
<line class="grid" x1="80" x2="728" y1="140.8" y2="140.8"/>
<text class="tick" x="72" y="144.8" text-anchor="end">200 MB</text>
<line class="grid" x1="80" x2="728" y1="96.0" y2="96.0"/>
<text class="tick" x="72" y="100.0" text-anchor="end">250 MB</text>
<text class="axlab" transform="translate(18 208.0) rotate(-90)" text-anchor="middle">Server peak memory</text>
<path d="M108.8,320.0 V304.3 Q108.8,300.3 112.8,300.3 H176.8 Q180.8,300.3 180.8,304.3 V320.0 Z" fill="var(--s1)"><title>1 large invoices at once: 22 MB</title></path>
<text class="val" x="144.8" y="292.3" text-anchor="middle">22 MB</text>
<text class="lab" x="144.8" y="340" text-anchor="middle">1 at once</text>
<path d="M238.4,320.0 V287.3 Q238.4,283.3 242.4,283.3 H306.4 Q310.4,283.3 310.4,287.3 V320.0 Z" fill="var(--s1)"><title>2 large invoices at once: 41 MB</title></path>
<text class="val" x="274.4" y="275.3" text-anchor="middle">41 MB</text>
<text class="lab" x="274.4" y="340" text-anchor="middle">2 at once</text>
<path d="M368.0,320.0 V249.6 Q368.0,245.6 372.0,245.6 H436.0 Q440.0,245.6 440.0,249.6 V320.0 Z" fill="var(--s1)"><title>4 large invoices at once: 83 MB</title></path>
<text class="val" x="404.0" y="237.6" text-anchor="middle">83 MB</text>
<text class="lab" x="404.0" y="340" text-anchor="middle">4 at once</text>
<path d="M497.6,320.0 V196.8 Q497.6,192.8 501.6,192.8 H565.6 Q569.6,192.8 569.6,196.8 V320.0 Z" fill="var(--s1)"><title>8 large invoices at once: 142 MB</title></path>
<text class="val" x="533.6" y="184.8" text-anchor="middle">142 MB</text>
<text class="lab" x="533.6" y="340" text-anchor="middle">8 at once</text>
<path d="M627.2,320.0 V105.4 Q627.2,101.4 631.2,101.4 H695.2 Q699.2,101.4 699.2,105.4 V320.0 Z" fill="var(--s1)"><title>16 large invoices at once: 244 MB</title></path>
<text class="val" x="663.2" y="93.4" text-anchor="middle">244 MB</text>
<text class="lab" x="663.2" y="340" text-anchor="middle">16 at once</text>
<line class="base" x1="80" x2="728" y1="320" y2="320"/>
<text class="axlab" x="404.0" y="364" text-anchor="middle">Large (15 MB) invoices sent at the same time — 4 workers</text>
</svg>
