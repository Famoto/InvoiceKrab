<path d="M250.0,236.0 H373.6 Q377.6,236.0 377.6,240.0 V250.0 Q377.6,254.0 373.6,254.0 H250.0 Z" fill="var(--s1)"><title>Factur-X input, glibc (Linux build): 3.8×</title></path>
<text class="val" x="383.6" y="249" stroke="var(--surface)" stroke-width="4" paint-order="stroke">3.8×</text>
<path d="M250.0,256.0 H350.1 Q354.1,256.0 354.1,260.0 V270.0 Q354.1,274.0 350.1,274.0 H250.0 Z" fill="var(--s2)"><title>Factur-X input, musl (Docker image): 3.1×</title></path>
