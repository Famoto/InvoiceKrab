<text class="tick" x="451.4" y="310" text-anchor="middle">6×</text>
<line class="grid" x1="518.6" x2="518.6" y1="110" y2="294"/>
<text class="tick" x="518.6" y="310" text-anchor="middle">8×</text>
<line class="grid" x1="585.7" x2="585.7" y1="110" y2="294"/>
<text class="tick" x="585.7" y="310" text-anchor="middle">10×</text>
<line class="grid" x1="652.9" x2="652.9" y1="110" y2="294"/>
<text class="tick" x="652.9" y="310" text-anchor="middle">12×</text>
<line class="grid" x1="720.0" x2="720.0" y1="110" y2="294"/>
<text class="tick" x="720.0" y="310" text-anchor="middle">14×</text>
<text class="axlab" x="485.0" y="332" text-anchor="middle">Peak memory per request ÷ invoice file size</text>
<text class="lab" x="238" y="143" text-anchor="end">FatturaPA input</text>
<path d="M250.0,120.0 H632.1 Q636.1,120.0 636.1,124.0 V134.0 Q636.1,138.0 632.1,138.0 H250.0 Z" fill="var(--s1)"><title>FatturaPA input, glibc (Linux build): 11.5×</title></path>
<text class="val" x="642.1" y="133" stroke="var(--surface)" stroke-width="4" paint-order="stroke">11.5×</text>
