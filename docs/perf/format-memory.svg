<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-label="Memory needed depends on the input format">

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .title { font-size:16px; font-weight:600; fill:var(--ink); }
  .sub { font-size:12px; fill:var(--ink2); }
  .tick { font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums; }
  .axlab { font-size:11px; fill:var(--ink2); }
  .lab { font-size:12px; fill:var(--ink); }
  .val { font-size:11px; fill:var(--ink2); font-variant-numeric:tabular-nums; }
  .grid { stroke:var(--grid); stroke-width:1; }
  .base { stroke:var(--axis); stroke-width:1; }
  .ref { stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; fill:none; }
</style>
<rect width="760" height="350" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="32">Memory needed depends on the input format</text>
<text class="sub" x="24" y="52">Worst output format, invoices of 1 MB and up. Compact FatturaPA expands the most.</text>
<line class="grid" x1="250.0" x2="250.0" y1="110" y2="294"/>
<text class="tick" x="250.0" y="310" text-anchor="middle">0×</text>
<line class="grid" x1="317.1" x2="317.1" y1="110" y2="294"/>
<text class="tick" x="317.1" y="310" text-anchor="middle">2×</text>
<line class="grid" x1="384.3" x2="384.3" y1="110" y2="294"/>
<text class="tick" x="384.3" y="310" text-anchor="middle">4×</text>
<line class="grid" x1="451.4" x2="451.4" y1="110" y2="294"/>
<text class="tick" x="451.4" y="310" text-anchor="middle">6×</text>
<line class="grid" x1="518.6" x2="518.6" y1="110" y2="294"/>
<text class="tick" x="518.6" y="310" text-anchor="middle">8×</text>
<line class="grid" x1="585.7" x2="585.7" y1="110" y2="294"/>
<text class="tick" x="585.7" y="310" text-anchor="middle">10×</text>
<line class="grid" x1="652.9" x2="652.9" y1="110" y2="294"/>
<text class="tick" x="652.9" y="310" text-anchor="middle">12×</text>
<line class="grid" x1="720.0" x2="720.0" y1="110" y2="294"/>
<text class="tick" x="720.0" y="310" text-anchor="middle">14×</text>
<text class="axlab" x="485.0" y="332" text-anchor="middle">Peak memory per request ÷ invoice file size</text>
<text class="lab" x="238" y="143" text-anchor="end">FatturaPA input</text>
<path d="M250.0,120.0 H558.2 Q562.2,120.0 562.2,124.0 V134.0 Q562.2,138.0 558.2,138.0 H250.0 Z" fill="var(--s1)"><title>FatturaPA input, glibc (Linux build): 9.3×</title></path>
<text class="val" x="568.2" y="133" stroke="var(--surface)" stroke-width="4" paint-order="stroke">9.3×</text>
