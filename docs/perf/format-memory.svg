<path d="M250.0,236.0 H309.8 Q313.8,236.0 313.8,240.0 V250.0 Q313.8,254.0 309.8,254.0 H250.0 Z" fill="var(--s1)"><title>Factur-X input, glibc (Linux build): 1.9×</title></path>
<text class="val" x="319.8" y="249" stroke="var(--surface)" stroke-width="4" paint-order="stroke">1.9×</text>
<path d="M250.0,256.0 H299.7 Q303.7,256.0 303.7,260.0 V270.0 Q303.7,274.0 299.7,274.0 H250.0 Z" fill="var(--s2)"><title>Factur-X input, musl (Docker image): 1.6×</title></path>
