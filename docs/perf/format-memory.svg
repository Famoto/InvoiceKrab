<path d="M250.0,236.0 H383.6 Q387.6,236.0 387.6,240.0 V250.0 Q387.6,254.0 383.6,254.0 H250.0 Z" fill="var(--s1)"><title>Factur-X input, glibc (Linux build): 4.1×</title></path>
<text class="val" x="393.6" y="249" stroke="var(--surface)" stroke-width="4" paint-order="stroke">4.1×</text>
<path d="M250.0,256.0 H363.5 Q367.5,256.0 367.5,260.0 V270.0 Q367.5,274.0 363.5,274.0 H250.0 Z" fill="var(--s2)"><title>Factur-X input, musl (Docker image): 3.5×</title></path>
<text class="val" x="373.5" y="269" stroke="var(--surface)" stroke-width="4" paint-order="stroke">3.5×</text>
<line class="ref" x1="652.9" x2="652.9" y1="110" y2="294"/>
<text class="val" x="652.9" y="104" text-anchor="middle">default booking 12×</text>
<line class="base" x1="250.0" x2="250.0" y1="110" y2="294"/>
<rect x="24" y="69" width="10" height="10" rx="2" fill="var(--s1)"/>
<text class="lab" x="40" y="78">glibc (Linux build)</text>
