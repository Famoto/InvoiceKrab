<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="krab-cli: wall time vs. input size">

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s0:#898781; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s0:#898781; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .title { font-size:16px; font-weight:600; fill:var(--ink); }
  .sub { font-size:12px; fill:var(--ink2); }
  .tick { font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums; }
  .axlab { font-size:11px; fill:var(--ink2); }
  .lab { font-size:12px; fill:var(--ink); }
  .val { font-size:11px; fill:var(--ink2); font-variant-numeric:tabular-nums; }
  .grid { stroke:var(--grid); stroke-width:1; }
  .base { stroke:var(--axis); stroke-width:1; }
  .ref { stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; fill:none; }
</style>
<rect width="760" height="420" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="32">krab-cli: wall time vs. input size</text>
<text class="sub" x="24" y="52">UBL source, median of 5 runs. Below ~100 KB, process start-up (~3 ms) dominates.</text>
<line class="grid" x1="72" x2="610" y1="360.0" y2="360.0"/>
<text class="tick" x="64" y="364.0" text-anchor="end">1 ms</text>
<line class="grid" x1="72" x2="610" y1="294.0" y2="294.0"/>
<text class="tick" x="64" y="298.0" text-anchor="end">10 ms</text>
<line class="grid" x1="72" x2="610" y1="228.0" y2="228.0"/>
<text class="tick" x="64" y="232.0" text-anchor="end">100 ms</text>
<line class="grid" x1="72" x2="610" y1="162.0" y2="162.0"/>
<text class="tick" x="64" y="166.0" text-anchor="end">1,000 ms</text>
<line class="grid" x1="72" x2="610" y1="96.0" y2="96.0"/>
<text class="tick" x="64" y="100.0" text-anchor="end">10,000 ms</text>
<text class="tick" x="108.2" y="378" text-anchor="middle">10 KB</text>
<text class="tick" x="228.3" y="378" text-anchor="middle">100 KB</text>
<text class="tick" x="348.5" y="378" text-anchor="middle">1 MB</text>
<text class="tick" x="468.7" y="378" text-anchor="middle">10 MB</text>
<text class="tick" x="588.8" y="378" text-anchor="middle">100 MB</text>
<line class="base" x1="72" x2="610" y1="360" y2="360"/>
<text class="axlab" x="341.0" y="400" text-anchor="middle">Input size (log scale)</text>
<text class="axlab" transform="translate(18 228.0) rotate(-90)" text-anchor="middle">Wall time (log scale)</text>
<polyline class="ref" points="72.0,328.5 610.0,328.5"/>
<text class="val" x="489.8" y="344.5">process start-up ≈ 3 ms</text>
<polyline points="103.1,317.3 225.7,309.1 342.8,271.5 462.7,211.9 582.9,142.2" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>
<circle cx="103.1" cy="317.3" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>→ UBL, 9.065 KB: 4.43 ms</title></circle>
<circle cx="225.7" cy="309.1" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>→ UBL, 95.154 KB: 5.9 ms</title></circle>
<circle cx="342.8" cy="271.5" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>→ UBL, 895.855 KB: 22 ms</title></circle>
<circle cx="462.7" cy="211.9" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>→ UBL, 8.91186 MB: 175 ms</title></circle>
<circle cx="582.9" cy="142.2" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>→ UBL, 89.1619 MB: 1,993 ms</title></circle>
<polyline points="103.1,308.4 225.7,307.3 342.8,270.7 462.7,206.7 582.9,139.6" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round"/>
<circle cx="103.1" cy="308.4" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>→ Factur-X, 9.065 KB: 6.05 ms</title></circle>
<circle cx="225.7" cy="307.3" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>→ Factur-X, 95.154 KB: 6.29 ms</title></circle>
<circle cx="342.8" cy="270.7" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>→ Factur-X, 895.855 KB: 23 ms</title></circle>
<circle cx="462.7" cy="206.7" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>→ Factur-X, 8.91186 MB: 210 ms</title></circle>
<circle cx="582.9" cy="139.6" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>→ Factur-X, 89.1619 MB: 2,185 ms</title></circle>
<polyline points="103.1,319.5 225.7,314.4 342.8,281.5 462.7,221.5 582.9,156.3" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linejoin="round"/>
<circle cx="103.1" cy="319.5" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"><title>→ FatturaPA, 9.065 KB: 4.11 ms</title></circle>
<circle cx="225.7" cy="314.4" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"><title>→ FatturaPA, 95.154 KB: 4.9 ms</title></circle>
<circle cx="342.8" cy="281.5" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"><title>→ FatturaPA, 895.855 KB: 15 ms</title></circle>
<circle cx="462.7" cy="221.5" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"><title>→ FatturaPA, 8.91186 MB: 125 ms</title></circle>
<circle cx="582.9" cy="156.3" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"><title>→ FatturaPA, 89.1619 MB: 1,220 ms</title></circle>
<rect x="622" y="127.6" width="10" height="10" rx="2" fill="var(--s2)"/>
<text class="lab" x="638" y="136.6">→ Factur-X</text>
<text class="val" x="638" y="150.6">2,185 ms</text>
<rect x="622" y="157.6" width="10" height="10" rx="2" fill="var(--s1)"/>
<text class="lab" x="638" y="166.6">→ UBL</text>
<text class="val" x="638" y="180.6">1,993 ms</text>
<rect x="622" y="187.6" width="10" height="10" rx="2" fill="var(--s3)"/>
<text class="lab" x="638" y="196.6">→ FatturaPA</text>
<text class="val" x="638" y="210.6">1,220 ms</text>
<rect x="24" y="69" width="10" height="10" rx="2" fill="var(--s1)"/>
<text class="lab" x="40" y="78">→ UBL</text>
<rect x="100.0" y="69" width="10" height="10" rx="2" fill="var(--s2)"/>
<text class="lab" x="116.0" y="78">→ Factur-X</text>
<rect x="212.0" y="69" width="10" height="10" rx="2" fill="var(--s3)"/>
<text class="lab" x="228.0" y="78">→ FatturaPA</text>

</svg>
