<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Invoices per second by invoice size">

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .title { font-size:16px; font-weight:600; fill:var(--ink); }
  .sub { font-size:12px; fill:var(--ink2); }
  .tick { font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums; }
  .axlab { font-size:11px; fill:var(--ink2); }
  .lab { font-size:12px; fill:var(--ink); }
  .val { font-size:11px; fill:var(--ink2); font-variant-numeric:tabular-nums; }
  .grid { stroke:var(--grid); stroke-width:1; }
  .base { stroke:var(--axis); stroke-width:1; }
  .ref { stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; fill:none; }
</style>
<rect width="760" height="420" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="32">Invoices per second by invoice size</text>
<text class="sub" x="24" y="52">HTTP service on a 4-core server. Larger invoices take proportionally longer.</text>
<line class="grid" x1="80" x2="560" y1="360.0" y2="360.0"/>
<text class="tick" x="72" y="364.0" text-anchor="end">100/s</text>
<line class="grid" x1="80" x2="560" y1="272.0" y2="272.0"/>
<text class="tick" x="72" y="276.0" text-anchor="end">1,000/s</text>
<line class="grid" x1="80" x2="560" y1="184.0" y2="184.0"/>
<text class="tick" x="72" y="188.0" text-anchor="end">10,000/s</text>
<line class="grid" x1="80" x2="560" y1="96.0" y2="96.0"/>
<text class="tick" x="72" y="100.0" text-anchor="end">100,000/s</text>
<text class="tick" x="80.0" y="378" text-anchor="middle"></text>
<text class="tick" x="135.5" y="378" text-anchor="middle">10 KB</text>
<text class="tick" x="320.0" y="378" text-anchor="middle">100 KB</text>
<text class="tick" x="504.5" y="378" text-anchor="middle">1 MB</text>
<text class="tick" x="560.0" y="378" text-anchor="middle"></text>
<line class="base" x1="80" x2="560" y1="360" y2="360"/>
<text class="axlab" x="320.0" y="400" text-anchor="middle">Invoice file size (log scale)</text>
<text class="axlab" transform="translate(18 228.0) rotate(-90)" text-anchor="middle">Invoices per second (log scale)</text>
<polyline points="127.7,176.6 316.0,249.8 495.7,330.6" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>
<circle cx="127.7" cy="176.6" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>To UBL / XRechnung, : 12,144/s</title></circle>
<circle cx="316.0" cy="249.8" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>To UBL / XRechnung, : 1,787/s</title></circle>
<circle cx="495.7" cy="330.6" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>To UBL / XRechnung, : 216/s</title></circle>
<polyline points="127.7,183.4 316.0,255.1 495.7,337.7" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round"/>
<circle cx="127.7" cy="183.4" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>To Factur-X, : 10,145/s</title></circle>
<circle cx="316.0" cy="255.1" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>To Factur-X, : 1,558/s</title></circle>
<circle cx="495.7" cy="337.7" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>To Factur-X, : 179/s</title></circle>
<rect x="572" y="318.6" width="10" height="10" rx="2" fill="var(--s1)"/>
<text class="lab" x="588" y="327.6">To UBL / XRechnung</text>
<text class="val" x="588" y="341.6">216/s</text>
<rect x="572" y="348.6" width="10" height="10" rx="2" fill="var(--s2)"/>
<text class="lab" x="588" y="357.6">To Factur-X</text>
<text class="val" x="588" y="371.6">179/s</text>
<rect x="24" y="69" width="10" height="10" rx="2" fill="var(--s1)"/>
<text class="lab" x="40" y="78">To UBL / XRechnung</text>
<rect x="193.6" y="69" width="10" height="10" rx="2" fill="var(--s2)"/>
<text class="lab" x="209.6" y="78">To Factur-X</text>

</svg>
