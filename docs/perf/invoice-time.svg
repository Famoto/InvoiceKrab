<circle cx="237.5" cy="317.4" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"><title>To FatturaPA, : 4.42 ms</title></circle>
<circle cx="339.2" cy="284.0" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"><title>To FatturaPA, : 14 ms</title></circle>
