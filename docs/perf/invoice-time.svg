<circle cx="443.3" cy="216.9" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>To Factur-X, : 147 ms</title></circle>
<circle cx="547.6" cy="151.4" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>To Factur-X, : 1.4 s</title></circle>
