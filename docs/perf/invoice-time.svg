<text class="tick" x="433.9" y="378" text-anchor="middle">10 MB</text>
<text class="tick" x="541.1" y="378" text-anchor="middle">100 MB</text>
<text class="tick" x="560.0" y="378" text-anchor="middle"></text>
<line class="base" x1="80" x2="560" y1="360" y2="360"/>
<text class="axlab" x="320.0" y="400" text-anchor="middle">Invoice file size (log scale)</text>
<text class="axlab" transform="translate(18 228.0) rotate(-90)" text-anchor="middle">Time (log scale)</text>
<polyline points="107.7,317.3 217.2,309.1 321.6,271.5 428.5,211.9 535.8,142.2" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>
