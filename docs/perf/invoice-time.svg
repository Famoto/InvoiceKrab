<text class="tick" x="72" y="298.0" text-anchor="end">10 ms</text>
<line class="grid" x1="80" x2="560" y1="228.0" y2="228.0"/>
<text class="tick" x="72" y="232.0" text-anchor="end">100 ms</text>
