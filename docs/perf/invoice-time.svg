<text class="tick" x="72" y="166.0" text-anchor="end">1 s</text>
<line class="grid" x1="80" x2="560" y1="96.0" y2="96.0"/>
<text class="tick" x="72" y="100.0" text-anchor="end">10 s</text>
<text class="tick" x="80.0" y="378" text-anchor="middle"></text>
<text class="tick" x="112.3" y="378" text-anchor="middle">10 KB</text>
