<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Time to convert one invoice">

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .title { font-size:16px; font-weight:600; fill:var(--ink); }
  .sub { font-size:12px; fill:var(--ink2); }
  .tick { font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums; }
  .axlab { font-size:11px; fill:var(--ink2); }
  .lab { font-size:12px; fill:var(--ink); }
  .val { font-size:11px; fill:var(--ink2); font-variant-numeric:tabular-nums; }
  .grid { stroke:var(--grid); stroke-width:1; }
  .base { stroke:var(--axis); stroke-width:1; }
  .ref { stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; fill:none; }
</style>
<rect width="760" height="420" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="32">Time to convert one invoice</text>
<text class="sub" x="24" y="52">End to end, command line, from a UBL invoice. Small invoices are dominated by the ~2 ms program start.</text>
<line class="grid" x1="80" x2="560" y1="360.0" y2="360.0"/>
<text class="tick" x="72" y="364.0" text-anchor="end">1 ms</text>
<line class="grid" x1="80" x2="560" y1="294.0" y2="294.0"/>
<text class="tick" x="72" y="298.0" text-anchor="end">10 ms</text>
<line class="grid" x1="80" x2="560" y1="228.0" y2="228.0"/>
<text class="tick" x="72" y="232.0" text-anchor="end">100 ms</text>
<line class="grid" x1="80" x2="560" y1="162.0" y2="162.0"/>
<text class="tick" x="72" y="166.0" text-anchor="end">1 s</text>
<line class="grid" x1="80" x2="560" y1="96.0" y2="96.0"/>
<text class="tick" x="72" y="100.0" text-anchor="end">10 s</text>
<text class="tick" x="80.0" y="378" text-anchor="middle"></text>
<text class="tick" x="111.4" y="378" text-anchor="middle">10 KB</text>
<text class="tick" x="215.7" y="378" text-anchor="middle">100 KB</text>
<text class="tick" x="320.0" y="378" text-anchor="middle">1 MB</text>
<text class="tick" x="424.3" y="378" text-anchor="middle">10 MB</text>
<text class="tick" x="528.6" y="378" text-anchor="middle">100 MB</text>
<text class="tick" x="560.0" y="378" text-anchor="middle"></text>
<line class="base" x1="80" x2="560" y1="360" y2="360"/>
<text class="axlab" x="320.0" y="400" text-anchor="middle">Invoice file size (log scale)</text>
<text class="axlab" transform="translate(18 228.0) rotate(-90)" text-anchor="middle">Time (log scale)</text>
<polyline points="133.5,333.5 237.5,317.1 339.2,280.2 443.3,214.2 547.6,151.5" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>
