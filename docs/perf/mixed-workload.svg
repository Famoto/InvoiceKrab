<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" width="760" height="348" role="img" aria-label="Small invoices beside large ones">

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .title { font-size:16px; font-weight:600; fill:var(--ink); }
  .sub { font-size:12px; fill:var(--ink2); }
  .tick { font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums; }
  .axlab { font-size:11px; fill:var(--ink2); }
  .lab { font-size:12px; fill:var(--ink); }
  .val { font-size:11px; fill:var(--ink2); font-variant-numeric:tabular-nums; }
  .grid { stroke:var(--grid); stroke-width:1; }
  .base { stroke:var(--axis); stroke-width:1; }
  .ref { stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; fill:none; }
</style>
<rect width="760" height="348" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="32">Small invoices beside large ones</text>
<text class="sub" x="24" y="52">4-core server. Typical invoices alone vs. while eight 15 MB invoices are being converted.</text>
<line class="grid" x1="150.0" x2="150.0" y1="90" y2="292"/>
<text class="tick" x="150.0" y="308" text-anchor="middle">0.1 ms</text>
<line class="grid" x1="292.5" x2="292.5" y1="90" y2="292"/>
<text class="tick" x="292.5" y="308" text-anchor="middle">1 ms</text>
<line class="grid" x1="435.0" x2="435.0" y1="90" y2="292"/>
<text class="tick" x="435.0" y="308" text-anchor="middle">10 ms</text>
<line class="grid" x1="577.5" x2="577.5" y1="90" y2="292"/>
<text class="tick" x="577.5" y="308" text-anchor="middle">100 ms</text>
<line class="grid" x1="720.0" x2="720.0" y1="90" y2="292"/>
<text class="tick" x="720.0" y="308" text-anchor="middle">1000 ms</text>
<text class="axlab" x="435.0" y="330" text-anchor="middle">Response time for a typical (16 KB) invoice (log scale)</text>
<text class="lab" x="138" y="141" text-anchor="end">Median</text>
<path d="M150.0,100.0 H282.0 Q286.0,100.0 286.0,104.0 V118.0 Q286.0,122.0 282.0,122.0 H150.0 Z" fill="var(--s1)"><title>Typical invoices only, Median: 0.9 ms</title></path>
<text class="val" x="292.0" y="115">0.9 ms</text>
<path d="M150.0,124.0 H602.6 Q606.6,124.0 606.6,128.0 V142.0 Q606.6,146.0 602.6,146.0 H150.0 Z" fill="var(--s2)"><title>Beside large, before, Median: 160 ms</title></path>
<text class="val" x="612.6" y="139">160.0 ms</text>
<path d="M150.0,148.0 H356.5 Q360.5,148.0 360.5,152.0 V166.0 Q360.5,170.0 356.5,170.0 H150.0 Z" fill="var(--s3)"><title>Beside large, worker kept free, Median: 3 ms</title></path>
<text class="val" x="366.5" y="163">3.0 ms</text>
<text class="lab" x="138" y="235" text-anchor="end">Slowest 1%</text>
<path d="M150.0,194.0 H342.7 Q346.7,194.0 346.7,198.0 V212.0 Q346.7,216.0 342.7,216.0 H150.0 Z" fill="var(--s1)"><title>Typical invoices only, Slowest 1%: 2.4 ms</title></path>
<text class="val" x="352.7" y="209">2.4 ms</text>
<path d="M150.0,218.0 H622.3 Q626.3,218.0 626.3,222.0 V236.0 Q626.3,240.0 622.3,240.0 H150.0 Z" fill="var(--s2)"><title>Beside large, before, Slowest 1%: 220 ms</title></path>
<text class="val" x="632.3" y="233">220.0 ms</text>
<path d="M150.0,242.0 H442.3 Q446.3,242.0 446.3,246.0 V260.0 Q446.3,264.0 442.3,264.0 H150.0 Z" fill="var(--s3)"><title>Beside large, worker kept free, Slowest 1%: 12 ms</title></path>
<text class="val" x="452.3" y="257">12.0 ms</text>
<line class="base" x1="150.0" x2="150.0" y1="90" y2="292"/>
<rect x="24" y="69" width="10" height="10" rx="2" fill="var(--s1)"/>
<text class="lab" x="40" y="78">Typical invoices only</text>
<rect x="215.20000000000002" y="69" width="10" height="10" rx="2" fill="var(--s2)"/>
<text class="lab" x="231.20000000000002" y="78">Beside large, before</text>
<rect x="399.20000000000005" y="69" width="10" height="10" rx="2" fill="var(--s3)"/>
<text class="lab" x="415.20000000000005" y="78">Beside large, worker kept free</text>

</svg>
