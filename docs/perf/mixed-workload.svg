<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Known limitation: large invoices delay small ones">

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .title { font-size:16px; font-weight:600; fill:var(--ink); }
  .sub { font-size:12px; fill:var(--ink2); }
  .tick { font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums; }
  .axlab { font-size:11px; fill:var(--ink2); }
  .lab { font-size:12px; fill:var(--ink); }
  .val { font-size:11px; fill:var(--ink2); font-variant-numeric:tabular-nums; }
  .grid { stroke:var(--grid); stroke-width:1; }
  .base { stroke:var(--axis); stroke-width:1; }
  .ref { stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; fill:none; }
</style>
<rect width="760" height="300" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="32">Known limitation: large invoices delay small ones</text>
<text class="sub" x="24" y="52">4-core server. Typical invoices alone vs. while eight 15 MB invoices are being converted.</text>
<line class="grid" x1="150.0" x2="150.0" y1="90" y2="244"/>
<text class="tick" x="150.0" y="260" text-anchor="middle">0.1 ms</text>
<line class="grid" x1="292.5" x2="292.5" y1="90" y2="244"/>
<text class="tick" x="292.5" y="260" text-anchor="middle">1 ms</text>
<line class="grid" x1="435.0" x2="435.0" y1="90" y2="244"/>
<text class="tick" x="435.0" y="260" text-anchor="middle">10 ms</text>
<line class="grid" x1="577.5" x2="577.5" y1="90" y2="244"/>
<text class="tick" x="577.5" y="260" text-anchor="middle">100 ms</text>
<line class="grid" x1="720.0" x2="720.0" y1="90" y2="244"/>
<text class="tick" x="720.0" y="260" text-anchor="middle">1000 ms</text>
<text class="axlab" x="435.0" y="282" text-anchor="middle">Response time for a typical (16 KB) invoice (log scale)</text>
<text class="lab" x="138" y="127" text-anchor="end">Median</text>
<path d="M150.0,100.0 H243.1 Q247.1,100.0 247.1,104.0 V118.0 Q247.1,122.0 243.1,122.0 H150.0 Z" fill="var(--s1)"><title>Typical invoices only, Median: 0.48 ms</title></path>
<text class="val" x="253.1" y="115">0.5 ms</text>
<path d="M150.0,124.0 H592.7 Q596.7,124.0 596.7,128.0 V142.0 Q596.7,146.0 592.7,146.0 H150.0 Z" fill="var(--s2)"><title>While large invoices run, Median: 136.31 ms</title></path>
<text class="val" x="602.7" y="139">136.3 ms</text>
<text class="lab" x="138" y="197" text-anchor="end">Slowest 1%</text>
<path d="M150.0,170.0 H316.4 Q320.4,170.0 320.4,174.0 V188.0 Q320.4,192.0 316.4,192.0 H150.0 Z" fill="var(--s1)"><title>Typical invoices only, Slowest 1%: 1.57 ms</title></path>
<text class="val" x="326.4" y="185">1.6 ms</text>
<path d="M150.0,194.0 H598.7 Q602.7,194.0 602.7,198.0 V212.0 Q602.7,216.0 598.7,216.0 H150.0 Z" fill="var(--s2)"><title>While large invoices run, Slowest 1%: 150.31 ms</title></path>
<text class="val" x="608.7" y="209">150.3 ms</text>
<line class="base" x1="150.0" x2="150.0" y1="90" y2="244"/>
<rect x="24" y="69" width="10" height="10" rx="2" fill="var(--s1)"/>
<text class="lab" x="40" y="78">Typical invoices only</text>
<rect x="215.20000000000002" y="69" width="10" height="10" rx="2" fill="var(--s2)"/>
<text class="lab" x="231.20000000000002" y="78">While large invoices run</text>

</svg>
