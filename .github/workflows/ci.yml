name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure Rust components
        run: rustup component add clippy rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check mappings and codecs
        run: cargo run --locked -p einvoice-dsl -- check config

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Install xmllint (XSD validation of emitted documents)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Cache business rules (Schematron)
        uses: actions/cache@v4
        with:
          path: target/schematron
          key: schematron-${{ hashFiles('scripts/fetch-schematron.sh') }}

      - name: Fetch business rules (EN 16931, XRechnung, Peppol Schematron)
        run: scripts/fetch-schematron.sh

      - name: Test workspace
        run: cargo test --workspace --locked
