name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned by commit SHA (the tag in the comment);
# Dependabot updates both.
jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure Rust components
        run: rustup component add clippy rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check mappings and codecs
        run: cargo run --locked -p einvoice-dsl -- check config

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Install xmllint (XSD validation of emitted documents)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build with a custom mapping configuration
        run: scripts/check-custom-config.sh

  reuse:
    name: Licensing (REUSE)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install reuse
        run: pipx install reuse==6.2.0

      - name: Every file carries copyright and license information
        run: reuse lint

      - name: The license texts in LICENSES/ match the top-level copies
        run: |
          cmp LICENSE LICENSES/AGPL-3.0-or-later.txt
          cmp LICENSE-EXCEPTION LICENSES/LicenseRef-KrabInvoice-Configuration-Exception.txt

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the MSRV toolchain
        # Keep in sync with `rust-version` in Cargo.toml.
        run: rustup toolchain install 1.88 --profile minimal

      - name: Check workspace on the MSRV
        run: cargo +1.88 check --workspace --all-targets --locked

  deny:
    name: Dependency policy
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cargo deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  docker:
    name: Docker images
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server
          tags: krab-server:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the CLI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: cli
          tags: krab-cli:ci
          load: true
          cache-from: type=gha

      - name: Smoke-test the images
        run: |
          docker run --rm krab-cli:ci --list
          docker run -d --name krab -p 8080:8080 -e KRAB_MEM_BUDGET_BYTES=200000000 krab-server:ci
          for _ in $(seq 30); do curl -fsS localhost:8080/health && break; sleep 1; done
          docker exec krab /krab-server --healthcheck
          curl -fsS localhost:8080/version
          curl -fsS -o /dev/null --data-binary @testfiles/en16931-full-ubl.xml \
              'localhost:8080/transform?to=xrechnung-invoice%3A3.0.2'
          docker rm -f krab
