repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: mapping-check
        name: mapping check
        entry: cargo run --locked -p einvoice-dsl -- check config
        language: system
        files: ^(Cargo\.(toml|lock)|config/.*\.toml|crates/einvoice-dsl/.*|crates/einvoice-interfaces/build\.rs)$
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        entry: cargo check --workspace --all-targets --locked
        language: system
        files: ^(Cargo\.(toml|lock)|crates/.*|config/.*\.toml)$
        pass_filenames: false

      - id: reuse-lint
        name: reuse lint
        entry: reuse lint
        language: system
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --locked -- -D warnings
        language: system
        files: ^(Cargo\.(toml|lock)|crates/.*|config/.*\.toml)$
        pass_filenames: false

      # Needs einvoice-validate (crate einvoice-cli) and its rule sets: see
      # the script.
      - id: validate-documents
        name: einvoice-validate (schema and Schematron of written documents)
        entry: scripts/validate-documents.sh
        language: system
        files: ^(Cargo\.(toml|lock)|crates/.*|config/.*\.toml|testfiles/.*\.xml|scripts/validate-documents\.sh)$
        pass_filenames: false
